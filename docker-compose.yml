services:
  postgres:
    image: postgres:16
    container_name: surgepass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: surgepass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
